[project]
name = "starspace"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "dandenseven", email = "knight1seven@gmail.com" }
]
dependencies = [
    "cowsay>=6.1",
    "psycopg2>=2.9.10",
    "flask>=3.1.0",
    "flask-cors>=5.0.1",
    "beautifulsoup4>=4.13.4",
    "requests>=2.32.4",
    "npm>=0.1.1",
    "firebase>=4.0.1",
]
readme = "README.md"
requires-python = ">= 3.13"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/starspace"]
